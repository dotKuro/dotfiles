[package]
name = "zsa-layer-switch"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
